# Regular material: wide blur, neutral chroma, bright specular rim.
#
# This is Apple's `.regular` glass, not `.clear`. The distinction matters:
# `.clear` is gated behind three conditions -- the element sits over
# media-rich content, that content tolerates a dimming layer, and the content
# *on* the glass is bold and bright. Cards, dialogs, headers, and sidebars
# meet none of them, and an earlier tuning of this file (blur 8, saturate 180,
# fill alpha 0.10/0.14) was `.clear` in all but name: the backdrop stayed
# legible straight through the card.
#
# `blur_px` is the lever that fixes that. At 8px the backdrop keeps its
# shapes and the eye refocuses past the card; at 28 it collapses into a
# colour field and the card reads as a surface. iOS 27's headline change was
# exactly this -- Apple tuned Liquid Glass to "diffuse complex content behind
# it much more effectively" rather than simply tinting it more heavily.
#
# `saturate_pct` drops from the 180 it used to be: boosting the backdrop's
# chroma pulls attention to what is *behind* the card. Apple's materials
# compress chroma toward neutral. 140 is the ceiling enforced by
# tests/test_token_data.py.
material:
  name: Glass
  blur_px: 28
  saturate_pct: 140
  rim_alpha: 0.45
  # Full-strength specular edge -- see `edge_scale` in frosted-glass.yaml for
  # why a diffuse material wants less of it.
  edge_scale: 1.0
