# Clear material: low-opacity fill with strong edge separation.
#
# Current generated cards do not blur or refract their backdrop. The low fill
# alphas in tokens/modes/ preserve transparency, while the bright rim and
# directional specular edge keep the pane visually distinct from its content.
material:
  name: Glass
  surface_backdrop: false
  rim_alpha: 0.45
  # Full-strength specular edge -- see `edge_scale` in frosted-glass.yaml for
  # why a diffuse material wants less of it.
  edge_scale: 1.0
