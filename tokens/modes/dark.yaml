material:
  fill_rgb: [90, 90, 94]
  fill_alpha_glass: 0.16
  fill_alpha_frosted: 0.45
  # Below the glass alpha on purpose -- see tokens/liquid-glass.yaml.
  fill_alpha_liquid: 0.13
  rim_rgb: [255, 255, 255]

  # Shared Frosted Glass luminance tuning, applied after its blur. Dark mode
  # pulls down and hardens that backdrop so the card reads as the nearer
  # surface. Clear Glass and Liquid Glass surfaces do not consume this remap.
  #
  # 85, not the 60 this once was: the remap should settle what is behind the
  # frosted card, not erase it.
  brightness_pct: 85
  contrast_pct: 106

  # The specular edge. White on top, black underneath, in both modes -- a lit
  # pane catches light on its upper edge and falls into shadow on its lower
  # one regardless of the ambient appearance. Only the strengths flip: against
  # a dark background the shade does more of the separating, so it carries the
  # heavier alpha of the two here.
  #
  # The highlight has to stay well clear of `fill_alpha_glass` above. With no
  # displacement map to bend light at the rim, a rim brighter than the body is
  # the only thing distinguishing this surface from frost -- once the body
  # catches up to the edge, both read as one flat translucent slab.
  highlight_rgb: [255, 255, 255]
  highlight_alpha: 0.45
  shade_rgb: [0, 0, 0]
  shade_alpha: 0.22

palette:
  accent: "#0A84FF"
  success: "#30D158"
  warning: "#FF9F0A"
  error: "#FF453A"
  scene: "#BF5AF2"
  text_primary: "#FFFFFF"
  text_secondary: "#EBEBF599"
  text_disabled: "#EBEBF561"
  divider: "rgba(84, 84, 88, 0.65)"
  opaque_surface: "#1C1C1E"
  background_from: "#101014"
  background_via: "#16161C"
  background_to: "#1B1620"
