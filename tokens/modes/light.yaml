material:
  fill_rgb: [255, 255, 255]
  fill_alpha_glass: 0.26
  fill_alpha_frosted: 0.55
  # A white rim is invisible on light-mode pages (dashboards and the flat
  # --primary-background-color fallback used by Settings/Developer
  # Tools/History/Logbook/Media alike). Apple uses a dark hairline for the
  # light-mode material edge; this matches the palette's existing divider
  # hue (`rgba(60, 60, 67, ...)`) instead of inventing a new one.
  rim_rgb: [60, 60, 67]

  # Luminance remap applied to the backdrop *after* the blur -- the mirror of
  # dark mode's (see modes/dark.yaml). Light mode lifts the backdrop and
  # softens it, so it settles *above* nothing and instead flattens toward
  # paper white, leaving the card's own fill and its dark text as the only
  # things with real contrast on screen.
  brightness_pct: 112
  contrast_pct: 92

  # The specular edge -- same two colours as dark mode (see modes/dark.yaml),
  # different strengths. On a light background a black under-edge would read
  # as a hard drawn line rather than shadow, so light mode leans on the
  # highlight instead and keeps the shade faint.
  highlight_rgb: [255, 255, 255]
  highlight_alpha: 0.60
  shade_rgb: [0, 0, 0]
  shade_alpha: 0.10

palette:
  accent: "#007AFF"
  success: "#34C759"
  warning: "#FF9500"
  error: "#FF3B30"
  scene: "#AF52DE"
  text_primary: "#1C1C1E"
  text_secondary: "#3C3C4399"
  text_disabled: "#3C3C4361"
  divider: "rgba(60, 60, 67, 0.18)"
  opaque_surface: "#F2F2F7"
  background_from: "#EEF2F8"
  background_via: "#E6ECF6"
  background_to: "#F7F4FA"
