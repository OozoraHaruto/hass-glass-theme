  card-mod-root-yaml: ".: |\n  /* .header's own backdrop-filter is native (--app-header-backdrop-filter,\n\
    \     set in glassbuild/variables.py) -- this only supplies what HA has no\n     variable for: fill,\
    \ border, and type tracking.\n     Selector is tripled to reach specificity (0,3,0), which beats hui-root's\n\
    \     own \".edit-mode .header\" rule (0,2,0) so the glass fill survives edit\n     mode regardless\
    \ of style-tag order. */\n  .header.header.header {\n    background: rgba(255, 255, 255, 0.55);\n\
    \    border-bottom: 1px solid rgba(255, 255, 255, 0.2);\n    letter-spacing: -0.4px;\n    transition:\
    \ background 300ms cubic-bezier(0.25, 0.1, 0.25, 1);\n  }\n  ha-tab-group {\n    letter-spacing: -0.2px;\n\
    \  }\n"
  card-mod-sidebar-yaml: ".: |\n  :host {\n    backdrop-filter: blur(40px) saturate(150%);\n    -webkit-backdrop-filter:\
    \ blur(40px) saturate(150%);\n    background: rgba(255, 255, 255, 0.55);\n    border-right: 1px solid\
    \ rgba(255, 255, 255, 0.2);\n    transition: background 300ms cubic-bezier(0.25, 0.1, 0.25, 1), backdrop-filter\
    \ 300ms cubic-bezier(0.25, 0.1, 0.25, 1);\n  }\n  .title {\n    letter-spacing: -0.4px;\n  }\n  ha-list-item-button\
    \ {\n    letter-spacing: -0.2px;\n  }\n"
